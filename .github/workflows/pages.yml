name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install package metadata
        run: npm ci --ignore-scripts

      - name: Regenerate test PKI
        run: npm run fixtures

      - name: Run checks
        run: npm run check


  standards-hardening:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install package metadata
        run: npm ci --ignore-scripts
      - name: Regenerate test PKI
        run: npm run fixtures
      - name: Install pinned differential parser dependencies
        run: npm install --no-save --ignore-scripts asn1js@3.0.6 pkijs@3.3.3
      - name: PKI.js differential parser checks
        run: npm run test:pkijs
      - name: Download pinned x509-limbo corpus
        run: curl --fail --silent --show-error --location https://raw.githubusercontent.com/C2SP/x509-limbo/554528a9b0c0d95e071f55de018326f0b65a8364/limbo.json --output /tmp/x509-limbo.json
      - name: x509-limbo parser compatibility smoke (informational while alpha)
        continue-on-error: true
        env:
          X509_LIMBO_JSON: /tmp/x509-limbo.json
        run: npm run test:limbo

  browser-e2e:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Playwright test runner
        run: npm install --no-save @playwright/test@1.56.1 @axe-core/playwright@4.10.2
      - name: Install browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Browser E2E
        run: npx playwright test

  deploy:
    needs: [test, standards-hardening, browser-e2e]
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
